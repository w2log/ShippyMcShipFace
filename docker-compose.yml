# ThermalDeck — Synology Container Manager → Project
#
# Folder: /volume1/docker/thermaldeck/
#   docker-compose.yml
#   data/
#
# UI: http://<nas-ip>:8080

services:
  thermaldeck:
    image: ghcr.io/w2log/thermaldeck:latest
    container_name: thermaldeck
    restart: unless-stopped
    # Bridge + publish is more reliable on Synology than host networking.
    # The container can still reach LAN printers (e.g. 172.16.x.x).
    ports:
      - "8080:8080"
    environment:
      PORT: "3001"
      DATA_DIR: /app/data
      # API_SECRET: "change-me"
    volumes:
      - ./data:/app/data
    # Ensure bind-mount writes work regardless of folder owner
    user: "0:0"
