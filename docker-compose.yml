# ThermalDeck — Synology Container Manager → Project (not Image import)
#
# Synology's "Add image from URL" cannot use ghcr.io. Create a Project instead;
# Docker pulls GHCR fine that way.
#
# Folder on NAS, e.g. /volume1/docker/thermaldeck/
#   docker-compose.yml  (this file)
#   data/               (empty folder; chown 1001:1001)
#
# UI: http://<nas-ip>:8080

services:
  thermaldeck:
    image: ghcr.io/w2log/thermaldeck:latest
    container_name: thermaldeck
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "3001"
      DATA_DIR: /app/data
      # API_SECRET: "change-me"
    volumes:
      - ./data:/app/data
